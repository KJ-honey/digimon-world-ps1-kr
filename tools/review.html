<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>디지몬 월드 · 기존 패치 복원 자료</title>
<style>
body{font:16px/1.6 system-ui;margin:32px auto;padding:0 24px;max-width:1200px;color:#17202b;background:#f5f6f8}h1{font-size:28px}header{border-bottom:2px solid #29476d;padding-bottom:16px}input,select,button{font:inherit;padding:7px 12px;border:1px solid #a4acb8;border-radius:5px}input{width:340px;max-width:80%}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}article{background:white;border:1px solid #ccd2da;border-radius:8px;margin:16px 0;padding:20px}small{color:#526276}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}.text{overflow:auto}.raster{line-height:30px;min-height:28px;white-space:nowrap;overflow-x:auto;padding:8px;background:#fff}canvas{image-rendering:pixelated;vertical-align:middle}code{font:12px ui-monospace;color:#9a3650}.tokens{white-space:pre-wrap;overflow-wrap:anywhere}.glyphgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px}.glyphgrid article{margin:0;text-align:center;padding:8px}.tag{color:#835400;font-weight:600}@media(max-width:800px){.pair{grid-template-columns:1fr}}
</style>
<header><small>복원 조사 / 2026-09-27</small><h1>디지몬 월드 한국어패치</h1><p>일본어 원문 후보와 기존 한국어 글꼴을 나란히 확인합니다. 아래 그림은 ROM 비트맵의 정적 재현이며 게임 화면·최종 줄 배치가 아닙니다.</p><p class="tag" id="notice">대사 경계는 패턴 검색 후보입니다. 전체 VM 해석과 번역 검수는 아직 완료되지 않았습니다. OCR 제안은 검색·번역·빌드에 사용하지 않습니다.</p><p id="mapping-status"></p></header>
<nav><select id="mode" aria-label="자료 종류"><option value="pairs">대사 대조 후보</option><option value="glyphs">전체 글꼴</option></select><input id="query" aria-label="검색" placeholder="일본어 원문, 후보 ID, 16진 오프셋 검색"><button id="prev">이전</button><button id="next">다음</button><span id="count" aria-live="polite"></span></nav>
<main id="content"></main>
<script>
const DATA=/*RECOVERY_DATA*/null;
const $=x=>document.getElementById(x), byCode=new Map(DATA.glyphs.map(g=>[g.code,g]));let page=0;
if(DATA.mapping_summary){const s=DATA.mapping_summary;$('mapping-status').textContent=`검수 문자표 적용 · 한글 ${s.unique_hangul}자 / ${s.hangul_glyphs}칸 · ${s.candidate_pairs.toLocaleString()}쌍 원본 바이트 왕복 일치. <XXXX>는 의미 미확정 코드, <XXXX:글자>는 같은 글자의 코드 구분입니다. 아래 문자열은 검색·대조용이며 제품 재삽입 입력이 아닙니다.`;$('query').placeholder='한국어, 일본어, 후보 ID, 16진 오프셋 검색';}else{$('mapping-status').textContent='이 자료에는 검수 문자표가 연결되지 않았습니다.';}
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function glyph(rows,scale=2){const c=el('canvas');c.width=12;c.height=11;c.style.width=12*scale+'px';c.style.height=11*scale+'px';const ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,12,11);ctx.fillStyle='#15212d';rows.forEach((row,y)=>{for(let x=0;x<12;x++)if(!(row&(0x8000>>x)))ctx.fillRect(x,y,1,1)});return c}
function raster(hex,lang){const box=el('div',undefined,'raster');for(let n=0;n<hex.length;n+=4){const code=hex.slice(n,n+4);if(code==='0D00'){box.append(el('code','<0D00>'),el('br'));continue}if(code==='8140'){box.append(el('span','　'));continue}const g=byCode.get(code);box.append(g?glyph(g[lang+'_rows']):el('code','<'+code+'>'));}return box}
function render(){const mode=$('mode').value,q=$('query').value.trim().toLowerCase();let entries=DATA[mode].filter(r=>!q||[r.id,r.japanese,r.korean,r.code,r.offset?.toString(16)].some(v=>String(v??'').toLowerCase().includes(q)));const pages=Math.max(1,Math.ceil(entries.length/32));page=Math.min(page,pages-1);$('count').textContent=`${entries.length.toLocaleString()}개 · ${page+1}/${pages}`;$('prev').disabled=page===0;$('next').disabled=page+1===pages;const target=$('content');target.replaceChildren();target.className=mode==='glyphs'?'glyphgrid':'';for(const r of entries.slice(page*32,(page+1)*32)){const card=el('article');if(mode==='glyphs'){card.append(el('small',`${r.index} · ${r.code}`),el('br'),glyph(r.kor_rows,5),el('div',`원문: ${r.japanese}`),el('small',r.changed?'글꼴 변경':'글꼴 동일'));if(DATA.mapping_summary)card.append(el('div',r.korean?`문자표: ${r.korean}`:`원래 코드 보존: <${r.code}>`));if(r.ocr_suggestion)card.append(el('div',`미검수 OCR: ${r.ocr_suggestion.text}`));}else{card.append(el('small',`${r.id} · DG.SCN 논리 파일 +0x${r.offset.toString(16).toUpperCase()}`));const columns=el('div',undefined,'pair'),jp=el('div',undefined,'text'),ko=el('div',undefined,'text');jp.append(el('h3','일본어 원문 후보'),el('p',r.japanese,'tokens'),raster(r.jpn_hex,'jpn'));ko.append(el('h3','기존 한국어'),...(r.korean!==undefined?[el('p',r.korean,'tokens')]:[]),raster(r.kor_hex,'kor'),el('small',r.unchanged_bytes?'원문과 코드 동일 — 미번역 여부는 별도 판정':'원문과 코드 다름'));columns.append(jp,ko);card.append(columns);const details=el('details'),summary=el('summary','원본 바이트');details.append(summary,el('p',r.jpn_hex,'tokens'),el('p',r.kor_hex,'tokens'));card.append(details)}target.append(card)}}
$('mode').onchange=()=>{page=0;render()};$('query').oninput=()=>{page=0;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};render();
</script></html>
