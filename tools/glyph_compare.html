<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>디지몬 월드 글리프 픽셀 대조</title>
<style>
:root{font:16px/1.45 system-ui,sans-serif;color:#202735;background:#f3f5f7}*{box-sizing:border-box}body{max-width:1400px;margin:auto;padding:22px}h1{font-size:1.5rem;margin:0 0 8px}p{margin:8px 0 14px}.muted{color:#536174}button,input,select,textarea{font:inherit}button,select,input,textarea{border:1px solid #aeb8c5;border-radius:5px;background:#fff;padding:7px 9px}button{cursor:pointer}button:hover{background:#e8f2ff}button:disabled{opacity:.45;cursor:default}.toolbar,.nav,.candidates{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.toolbar input{min-width:220px}main{display:grid;grid-template-columns:minmax(400px,1fr) minmax(360px,450px);gap:18px}.panel{background:white;border:1px solid #cbd4df;border-radius:8px;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px;max-height:75vh;overflow:auto}.cell{min-height:85px;text-align:center;padding:5px}.cell canvas{display:block;margin:3px auto}.cell.active{outline:3px solid #2361ad}.cell.exact{background:#e7f5e8}.cell.saved{background:#e7efff}.cell.conflict{box-shadow:inset 0 0 0 2px #c97930}canvas{image-rendering:pixelated}.preview{display:flex;gap:20px;margin:18px 0}.preview figure{margin:0;text-align:center}.preview figcaption{margin-bottom:8px}.preview canvas{border:1px solid #d7dce2;background:white}label{display:block;margin:10px 0 4px;font-weight:600}#character{width:7em;font-size:1.35rem}#note{width:100%;min-height:60px}.candidate{text-align:center;min-width:60px}.candidate canvas{display:block;margin:auto}.candidate.selected{outline:2px solid #2361ad}.status{min-height:1.5em}.error{color:#a12323}.warning{color:#8a4310;font-weight:600}.good{color:#205b37;font-weight:600}.hint{font-size:.9rem}@media(max-width:850px){main{display:block}.panel{margin-bottom:16px}.grid{max-height:280px}}
</style>
<h1>글리프 픽셀 대조</h1>
<p>제공된 굴림 2.21의 12px 비트맵으로 한글 11,172자를 생성해 기존 패치의 12×11 글리프와 픽셀 단위로 비교했습니다. 기본 목록에는 1픽셀 차이의 근접 항목 3개만 표시합니다.</p>
<div class="toolbar"><label for="filter">보기</label><select id="filter"><option value="unresolved">근접 후보 검수</option><option value="unmatched">픽셀 불일치 전체 9개</option><option value="distant">굴림 후보 없는 6개</option><option value="conflicts">기존 검수와 충돌</option><option value="changed">변경 글리프 전체</option><option value="exact">픽셀 완전 일치</option><option value="all">전체 991개</option></select><input id="search" placeholder="번호·코드·문자 검색" aria-label="글리프 검색"><span id="summary" class="muted"></span></div>
<main><section class="panel"><div id="grid" class="grid"></div></section><section class="panel"><div class="nav"><button id="prev">← 이전</button><strong id="position"></strong><button id="next">다음 →</button></div><div id="meta"></div><div class="preview"><figure><figcaption>기존 한국어판</figcaption><div id="kor"></div></figure><figure><figcaption>일본어 원판</figcaption><div id="jpn"></div></figure></div><p id="result"></p><div id="candidates" class="candidates"></div><label for="character">선택 문자 (한 글자)</label><input id="character" maxlength="2" autocomplete="off" spellcheck="false"><label for="note">메모 (선택)</label><textarea id="note" maxlength="2000"></textarea><p><button id="save">문자 저장</button></p><p id="saved" class="status" aria-live="polite"></p><p class="muted hint">후보를 누르거나 문자를 직접 입력한 뒤 저장하세요. 픽셀 차이가 큰 항목은 굴림 한글이 아닐 수 있어 후보 순위만으로 확정하면 안 됩니다. 픽셀 완전 일치 항목은 자동 결과를 우선 표시하고 수정 입력을 막습니다. 기존 수동 검수 기록은 보존됩니다.</p></section></main>
<script>
const $=id=>document.getElementById(id);let sourceHash,glyphs,decisions,comparison,visible=[],selected=-1;
function canvas(rows,scale){const c=document.createElement('canvas');c.width=12;c.height=11;c.style.width=12*scale+'px';c.style.height=11*scale+'px';const x=c.getContext('2d');x.fillStyle='white';x.fillRect(0,0,12,11);x.fillStyle='#16202d';rows.forEach((row,y)=>{for(let col=0;col<12;col++)if(!(row&(0x8000>>col)))x.fillRect(col,y,1,1)});return c}
function match(i){return comparison.matches[String(i)]}function decision(i){return decisions[String(i)]}function conflict(i){const m=match(i),d=decision(i);return m?.kind==='exact'&&d?.character&&!m.characters.includes(d.character)}
function filterList(preferred=0){const type=$('filter').value,q=$('search').value.trim().toLowerCase();visible=glyphs.filter(g=>{const m=match(g.index),d=decision(g.index),distance=m?.characters?.[0]?.pixel_difference;const keep={unresolved:m?.kind==='unmatched'&&distance<=10&&d?.status!=='confirmed',unmatched:m?.kind==='unmatched',distant:m?.kind==='unmatched'&&distance>10,conflicts:conflict(g.index),changed:g.changed,exact:m?.kind==='exact',all:true}[type];return keep&&(!q||[g.index,g.code,g.japanese,g.ocr_suggestion?.text,m?.kind==='exact'?m.characters[0]:'',d?.character].some(v=>String(v??'').toLowerCase().includes(q)))}).map(g=>g.index);if(!visible.includes(selected))selected=visible[Math.min(preferred,visible.length-1)]??-1;render()}
function render(){const conflicts=glyphs.filter(g=>conflict(g.index)).length,near=glyphs.filter(g=>match(g.index)?.kind==='unmatched'&&match(g.index).characters[0].pixel_difference<=10&&decision(g.index)?.status!=='confirmed').length,distant=glyphs.filter(g=>match(g.index)?.kind==='unmatched'&&match(g.index).characters[0].pixel_difference>10).length;$('summary').textContent=`픽셀 일치 ${comparison.exact_count} / 근접 후보 미확정 ${near} / 굴림 후보 없는 항목 ${distant} / 기존 검수 충돌 ${conflicts} / 표시 ${visible.length}`;const grid=$('grid');grid.replaceChildren();for(const i of visible){const g=glyphs[i],m=match(i),d=decision(i),b=document.createElement('button');b.type='button';b.className='cell'+(i===selected?' active':'')+(m?.kind==='exact'?' exact':'')+(d?.status==='confirmed'?' saved':'')+(conflict(i)?' conflict':'');b.title=`${i} · ${g.code}`;const label=m?.kind==='exact'?m.characters[0]:d?.character||g.ocr_suggestion?.text||'—';b.append(document.createTextNode(`${i} · ${g.code}`),canvas(g.kor_rows,3),document.createTextNode(label));b.onclick=()=>{selected=i;renderDetail();grid.querySelectorAll('.active').forEach(x=>x.classList.remove('active'));b.classList.add('active')};grid.append(b)}renderDetail()}
function renderDetail(){const i=selected,g=glyphs[i],m=match(i),d=decision(i),at=visible.indexOf(i);$('position').textContent=i<0?'표시할 글리프 없음':`${at+1} / ${visible.length}`;$('prev').disabled=at<=0;$('next').disabled=at<0||at===visible.length-1;$('meta').textContent=g?`#${i} · 코드 ${g.code} · 원판 문자 ${g.japanese} · 비트맵 ${g.changed?'변경':'동일'}`:'';$('kor').replaceChildren(...(g?[canvas(g.kor_rows,10)]:[]));$('jpn').replaceChildren(...(g?[canvas(g.jpn_rows,10)]:[]));$('candidates').replaceChildren();$('character').value=m?.kind==='exact'?m.characters[0]:d?.character||'';$('note').value=d?.note||'';$('character').disabled=!g||m?.kind==='exact';$('note').disabled=!g||m?.kind==='exact';$('save').disabled=!g||m?.kind==='exact';$('saved').textContent='';if(!g){$('result').textContent='';return}
 const o=g.ocr_suggestion?.text;if(m?.kind==='exact'){$('result').textContent=`픽셀 완전 일치: ${m.characters.join(' / ')} · OCR ${o||'없음'}${o&&!m.characters.includes(o)?' (오인식)':''}${conflict(i)?` · 기존 검수 ${d.character}와 충돌`:''}`;$('result').className=conflict(i)?'warning':'good'}
 else if(m?.kind==='unmatched'){
  const distance=m.characters[0]?.pixel_difference??'-',near=distance<=10;
  $('result').textContent=near?`굴림 한글과 완전 일치 없음 · 가까운 후보와 ${distance}픽셀 차이 · OCR ${o||'없음'}`:`굴림 한글 후보 없음 · 가장 가까운 글자도 ${distance}픽셀 차이 · OCR 제안 ${o||'없음'}은 신뢰할 수 없음`;
  $('result').className='warning';
  const list=near?m.characters.filter(c=>c.pixel_difference<=10).slice(0,8):[];
  for(const candidate of list){const b=document.createElement('button');b.type='button';b.className='candidate';b.append(document.createTextNode(candidate.character),canvas(candidate.rows,4),document.createTextNode(`${candidate.pixel_difference}px 차이`));b.onclick=()=>{$('character').value=candidate.character;$('candidates').querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('candidates').append(b)}
 }else{$('result').textContent=`굴림 한글 자동 대조 대상 아님 · OCR ${o||'없음'}${d?` · 기존 검수 ${d.character}`:''}`;$('result').className='muted'}}
function move(delta){const at=visible.indexOf(selected),to=at+delta;if(to>=0&&to<visible.length){selected=visible[to];renderDetail();const cells=$('grid').children;for(const c of cells)c.classList.remove('active');cells[to].classList.add('active');cells[to].scrollIntoView({block:'nearest'})}}
async function save(){if(selected<0)return;const i=selected,at=visible.indexOf(i),g=glyphs[i];$('saved').textContent='저장 중…';try{const res=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source_sha256:sourceHash,index:i,status:'confirmed',character:$('character').value,note:$('note').value})}),body=await res.json();if(!res.ok)throw Error(body.error);decisions[String(i)]=body.decision;filterList(at);$('saved').textContent=`저장 완료 · #${i} ${g.code}`;$('saved').className='status good'}catch(e){$('saved').textContent=`저장 실패: ${e.message}`;$('saved').className='status error'}}
$('save').onclick=save;$('filter').onchange=()=>filterList();$('search').oninput=()=>filterList();$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);document.onkeydown=e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)};
fetch('/api/data').then(async r=>{const body=await r.json();if(!r.ok)throw Error(body.error);sourceHash=body.source_sha256;glyphs=body.glyphs;decisions=body.decisions;comparison=body.comparison;filterList()}).catch(e=>{$('summary').textContent=`불러오기 실패: ${e.message}`;$('summary').className='error'});
</script></html>
